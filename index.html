<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAMI Certificate Verification</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      color: #222;
    }

    header {
      background: #0b5fa5;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header h2 {
      font-size: 20px;
      font-weight: normal;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .container h3 {
      font-size: 26px;
      color: #0b5fa5;
      margin-bottom: 15px;
    }

    .container p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0b5fa5;
      border: none;
      color: white;
      font-size: 17px;
      border-radius: 7px;
      cursor: pointer;
    }

    button:hover {
      background: #084b82;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      display: none;
      text-align: left;
    }

    .valid {
      background: #e8f7ed;
      border: 1px solid #28a745;
      color: #155724;
    }

    .invalid {
      background: #fdeaea;
      border: 1px solid #dc3545;
      color: #721c24;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Afghanistan Association of Medical Imaging</h1>
    <h2>AAMI</h2>
  </header>

  <div class="container">

    <h3>Certificate Verification</h3>

    <p>
      Enter the Certificate ID printed on your AAMI certificate
      to verify its authenticity.
    </p>

    <input
      type="text"
      id="certificateId"
      placeholder="Enter Certificate ID"
    >

    <button onclick="verifyCertificate()">
      Verify Certificate
    </button>

    <div id="result"></div>

  </div>

  <footer>
    © 2026 Afghanistan Association of Medical Imaging (AAMI)
  </footer>

  <script>

    const certificates = {
      "AAMI-2026-0001": {
        name: "Ahmad Ahmad",
        certificate: "Certificate of Participation",
        event: "Second Scientific Conference",
        date: "November 8, 2026"
      }
    };

    function verifyCertificate() {

      const id = document
        .getElementById("certificateId")
        .value
        .trim()
        .toUpperCase();

      const result = document.getElementById("result");

      if (certificates[id]) {

        const cert = certificates[id];

        result.className = "valid";

        result.innerHTML = `
          <h3>✅ Certificate Verified</h3>
          <br>
          <strong>Certificate ID:</strong> ${id}<br><br>
          <strong>Name:</strong> ${cert.name}<br><br>
          <strong>Certificate:</strong> ${cert.certificate}<br><br>
          <strong>Event:</strong> ${cert.event}<br><br>
          <strong>Date:</strong> ${cert.date}<br><br>
          <strong>Issued by:</strong>
          Afghanistan Association of Medical Imaging (AAMI)
        `;

      } else {

        result.className = "invalid";

        result.innerHTML = `
          <h3>❌ Certificate Not Found</h3>
          <br>
          The Certificate ID you entered could not be verified.
          Please check the ID and try again.
        `;
      }

      result.style.display = "block";
    }

  </script>

</body>
</html>
